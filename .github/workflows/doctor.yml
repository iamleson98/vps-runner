name: Doctor (weekly health check)

# Runs scripts/doctor.sh on the VPS over SSH and reports results.
# Manual runs are possible any time; scheduled weekly on Monday 03:00 UTC.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - SSH secrets
        run: |
          missing=0
          for name in VPS_SSH_KEY VPS_SSH_HOST VPS_SSH_USER; do
            if [ -z "$(printenv "${name}")" ]; then
              echo "::error title=missing secret::${name} is not set (deploy first)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Run doctor.sh on the VPS
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -i "$KEY_FILE" -p "${VPS_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${VPS_SSH_USER}@${VPS_SSH_HOST}" \
            'bash /opt/vps-runner/scripts/doctor.sh' | tee doctor.log

      - name: Annotate failures
        if: ${{ failure() }}
        run: |
          grep '\[fail\]' doctor.log | while IFS= read -r line; do
            msg="$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g; s/^ *\[fail\] *//' )"
            echo "::error title=vps doctor::${msg}"
          done || true

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## VPS doctor"
            echo '   ```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed 's/\x1b\[[0-9;]*m//g' doctor.log >> "$GITHUB_STEP_SUMMARY" || true
          {
            echo '   ```'
          } >> "$GITHUB_STEP_SUMMARY"
